# Tudoholic Size Charts — the web server (nginx) site for sizecharts.tudoholic.com.
#
# On the server, as the admin:
#   sudo cp /srv/apps/size-chart-shopify-app/deploy/nginx/sizecharts.tudoholic.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sizecharts.tudoholic.com
# certbot then adds the HTTPS part and the redirect from http to https itself.
# (Without its nginx plugin: sudo certbot certonly --webroot -w /var/www/certbot
#  -d sizecharts.tudoholic.com, then add the 443 block like Logistics' site.)
#
# Deliberately NO proxy_cache here, unlike the Logistics site: every /api
# answer belongs to the Shopify login that asked, and a shared cache would
# hand one person's answer to the next caller of the same address.

server {
    listen 80;
    server_name sizecharts.tudoholic.com;

    # The listing team's sheet is uploaded through this site; nginx refuses
    # anything over 1 MB unless told otherwise. The app itself allows 20 MB.
    client_max_body_size 25m;

    # certbot's check file, for the webroot way of getting the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # The container listens here (docker-compose.yml). The server's other
        # sites hold 3001 (delivery), 3002 (Logistics) and 3003 (chinaops).
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
