# Tudoholic Ranking — the one public address: the storefront pixel posts here.
# Included from the sizecharts.tudoholic.com site so no new DNS record or
# certificate is needed. On the server, as the admin, add this line inside the
# `listen 443` server block of /etc/nginx/sites-enabled/sizecharts.tudoholic.com.conf:
#
#   include /srv/apps/size-chart-shopify-app/ranking/deploy/nginx/ranking-location.conf;
#
# then: sudo nginx -t && sudo systemctl reload nginx
# Check: curl -X POST -d '{}' https://sizecharts.tudoholic.com/rank/e  ->  HTTP 204
#
# Only /rank/e is forwarded. /admin/run and /health stay private to the server.

location = /rank/e {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3005/e;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}
